# SPDX-License-Identifier: GPL-3.0-or-later
#
# Run the strict test suite, coverage gate, link curves and synthetic receiver
# study on both supported releases. Keep each release's evidence separately.
name: matlab

on:
  workflow_dispatch:
    inputs:
      public_iq:
        description: Compare the 16 public CoaxSweep captures with the frozen local Python results
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: matlab-${{ github.ref }}${{ inputs.public_iq && '-public-iq' || '' }}
  cancel-in-progress: true

jobs:
  public-iq:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.public_iq }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        release: [R2024b, R2026b]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify the comparison rejects shifted scores and CRC words
        run: python3 -B -m unittest discover -s scripts -p test_public_iq_ci.py -v
      - name: Download and verify the registered windows from the author
        shell: bash
        run: |
          scratch=$(mktemp -d "$RUNNER_TEMP/coaxsweep.XXXXXXXX")
          echo "IQ_SCRATCH=$scratch" >> "$GITHUB_ENV"
          python3.12 -m venv "$scratch/venv"
          "$scratch/venv/bin/python" -m pip --disable-pip-version-check install --no-cache-dir --only-binary=:all: --require-hashes -r /dev/stdin <<'REQUIREMENTS'
          numpy==2.4.3 --hash=sha256:e7dd01a46700b1967487141a66ac1a3cf0dd8ebf1f08db37d46389401512ca97
          REQUIREMENTS
          "$scratch/venv/bin/python" -B scripts/public_iq_ci.py prepare "$scratch/inputs"
      - uses: matlab-actions/setup-matlab@f9e43010f1ae678f7cfa0542fe2a4f60f7d1ad8d # v3.1.0
        with:
          release: ${{ matrix.release }}
      - name: Replay every window in MATLAB
        uses: matlab-actions/run-command@bfa857648f4895aa98a446fe41c85e0788421ed5 # v3.3.0
        with:
          command: >-
            addpath("src","examples"); folder=getenv("IQ_SCRATCH");
            replayPublicWindows(fullfile(folder,"inputs"),fullfile(folder,"matlab.json"));
            writelines(jsonencode(struct("release","R"+string(version("-release")),"matlab",string(version))),fullfile(folder,"version.json"));
      - name: Compare bits, BER and both CRC-32 words for each frame
        id: verify
        run: |
          python3 -B scripts/public_iq_ci.py check "$IQ_SCRATCH" "${{ matrix.release }}" "$RUNNER_TEMP/verification.json"
      - name: Archive the per-window verification
        if: ${{ !cancelled() && (steps.verify.outcome == 'success' || steps.verify.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: public-iq-${{ matrix.release }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verification.json
          if-no-files-found: error
      - name: Remove temporary replay inputs
        if: ${{ always() && env.IQ_SCRATCH != '' }}
        run: rm -rf -- "$IQ_SCRATCH"

  tests:
    if: ${{ !inputs.public_iq }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        release: [R2024b, R2026b]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test the coverage gate
        run: python3 -B -m unittest discover -s scripts -p test_check_coverage.py -v
      - uses: matlab-actions/setup-matlab@f9e43010f1ae678f7cfa0542fe2a4f60f7d1ad8d # v3.1.0
        with:
          release: ${{ matrix.release }}
      - id: matlab_tests
        uses: matlab-actions/run-tests@214a16e600ef2c705a4b2dd6c0794dc6957682a9 # v3.3.0
        with:
          source-folder: src
          select-by-folder: tests
          strict: true
          startup-options: -logfile matlab-tests.log
          test-results-junit: matlab-tests.xml
          code-coverage-cobertura: coverage.xml
      - name: Line coverage of the package, at least 95 %
        if: ${{ !cancelled() && steps.matlab_tests.outcome != 'skipped' }}
        shell: bash
        run: python3 scripts/check_coverage.py coverage.xml 2>&1 | tee coverage-summary.txt
      - name: Upload coverage and test evidence
        if: ${{ !cancelled() && steps.matlab_tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.release }}-${{ github.run_attempt }}
          path: |
            coverage.xml
            coverage-summary.txt
            matlab-tests.xml
            matlab-tests.log
          if-no-files-found: error
      - name: The error rate curves
        if: ${{ !cancelled() && steps.matlab_tests.outcome == 'success' }}
        uses: matlab-actions/run-command@bfa857648f4895aa98a446fe41c85e0788421ed5 # v3.3.0
        with:
          command: addpath("src", "examples"); disp(linkCurves())
      - name: Create a fresh output directory for the synthetic study
        id: study_path
        if: ${{ !cancelled() && steps.matlab_tests.outcome == 'success' }}
        run: mkdir study-output
      - name: Run the synthetic receiver study
        id: study
        if: ${{ !cancelled() && steps.study_path.outcome == 'success' }}
        uses: matlab-actions/run-command@bfa857648f4895aa98a446fe41c85e0788421ed5 # v3.3.0
        with:
          command: addpath("src", "examples"); runReceiverStudy("study-output")
      - name: Check the study produced both outputs
        if: ${{ !cancelled() && steps.study.outcome == 'success' }}
        run: |
          test -s study-output/frames.csv
          test -s study-output/environment.json
      - name: Upload synthetic study results
        if: ${{ !cancelled() && (steps.study.outcome == 'success' || steps.study.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: receiver-study-${{ matrix.release }}-${{ github.run_attempt }}
          path: |
            study-output/frames.csv
            study-output/environment.json
          if-no-files-found: error
      - name: Recreate the 16-QAM fading contrast and run the two fresh streams
        id: fading
        if: ${{ !cancelled() && steps.study.outcome == 'success' }}
        uses: matlab-actions/run-command@bfa857648f4895aa98a446fe41c85e0788421ed5 # v3.3.0
        with:
          command: addpath("src", "examples"); runCoherentFadingCheck("fading-frames.csv")
      - name: Upload the synthetic fading records
        if: ${{ !cancelled() && steps.fading.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fading-calibration-${{ matrix.release }}-${{ github.run_attempt }}
          path: fading-frames.csv
          if-no-files-found: error
      - name: Generate the bench transmit references and digital controls
        id: bench
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && steps.matlab_tests.outcome == 'success' }}
        uses: matlab-actions/run-command@bfa857648f4895aa98a446fe41c85e0788421ed5 # v3.3.0
        with:
          command: addpath("src","examples"); writeBenchReferences("bench-tx"); benchDigitalControls("bench-tx","bench-controls");
      - name: Create the generated source-format controls
        if: ${{ !cancelled() && steps.bench.outcome == 'success' }}
        run: python3 scripts/foreign_waveform_controls.py source-controls
      - name: Check the frame adapter on generated controls
        id: adapter
        if: ${{ success() && steps.bench.outcome == 'success' }}
        uses: matlab-actions/run-command@bfa857648f4895aa98a446fe41c85e0788421ed5 # v3.3.0
        with:
          command: >-
            addpath("src","examples"); r=replayPublicWindows("source-controls","source-controls.json");
            assert(isequal([r.Bits],[4096 4096 0]) && isequaln([r.BitErrors],[0 1 NaN]) &&
            isequaln([r.Crc32Passed],[1 0 NaN]) && ~any([r.NativeCrc24Passed]));
      - name: Archive the generated TX files and digital control outcomes
        if: ${{ !cancelled() && steps.bench.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-reference-${{ matrix.release }}-${{ github.run_attempt }}
          path: |
            bench-tx/frame-*.mat
            bench-tx/frame-*.cf32
            bench-tx/frame-*.bin
            bench-controls/control-results.json
            source-controls.json
          if-no-files-found: error
